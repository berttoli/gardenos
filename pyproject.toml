[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-os"
version = "0.1.0"
description = "Self-hosted garden management application."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Garden OS" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "duckdb>=1.0,<2",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "passlib>=1.7.4,<2",
  "pillow>=10,<12",
  "pg8000>=1.31,<2",
  "pydantic>=2.8,<3",
  "qrcode>=7.4,<8",
  "reportlab>=4.2,<5",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
