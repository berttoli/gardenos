version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend-site
    schedule:
      interval: weekly
    groups:
      development-tools:
        dependency-type: development
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
